      <path d="M-23 43 C-25 25 -15 16 0 16 C17 16 25 27 23 46 L21 55 Q18 68 6 75 Q0 79 -6 75 Q-19 68 -21 56Z"/>
      <path fill="#393535" d="M-23 49 C-28 32 -20 16 -5 14 Q11 10 21 25 Q27 33 23 50 L19 45 Q16 36 12 32 Q2 39 -10 38 Q-17 39 -20 48Z"/>
      <path fill="none" stroke="#79716c" stroke-width="1" d="M-20 35 Q-8 22 6 22 M-13 36 Q0 31 9 24"/>
    </g>
    <path id="cups" d="M-46 143 C-43 163 -16 172 -3 149 M46 143 C43 163 16 172 3 149"/>
    <g id="straps" fill="none" stroke-width="4" stroke-linecap="round"><path d="M-41 135 L-34 98 M41 135 L34 98"/></g>
  </defs>
  <rect width="720" height="480" fill="#fff"/>
  <g fill="none" stroke="#dcd5cc" stroke-width="1">
