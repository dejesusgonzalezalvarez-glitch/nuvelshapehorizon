    <use href="#figure"/>
    <use href="#straps" stroke="#91867e"/>
    <path fill="#fbf8f4" stroke="#80736a" stroke-width="1.6" d="M-44 127 Q-40 124 -30 129 Q-8 139 0 143 Q8 139 30 129 Q40 124 44 127 L48 143 Q47 156 39 162 Q20 168 0 164 Q-20 168 -39 162 Q-47 156 -48 143Z"/>
    <use href="#cups" fill="none" stroke="#a3968d" stroke-width="1.2"/>
    <path fill="#fbf8f4" stroke="#80736a" stroke-width="1.6" d="M-49 229 Q0 241 49 229 L53 244 Q25 253 9 282 Q0 288 -9 282 Q-24 253 -53 244Z"/>
