      <use href="#cups"/>
      <path d="M-39 160 C-26 181 -27 211 -40 235 M39 160 C26 181 27 211 40 235 M-50 243 Q-21 255 -7 279 M50 243 Q21 255 7 279"/>
      <path d="M-28 173 Q0 179 28 173 M-26 221 Q0 228 26 221" stroke="#696364" stroke-dasharray="2 3"/>
