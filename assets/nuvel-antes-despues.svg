<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Antes y después de ponerse la faja Nuvel</title>
  <desc id="desc">Dos vistas frontales de la misma figura sin rasgos faciales. A la izquierda lleva ropa interior clara. A la derecha, un body negro con copas, tirantes finos y panel de ajuste en la cintura.</desc>
  <defs>
    <g id="figure" fill="#f2e7de" stroke="#554b47" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <!-- Arms, drawn behind the torso -->
      <path id="arm" d="M-36 95 Q-54 94 -58 116 C-64 144 -61 162 -68 191 Q-72 209 -73 235 L-76 254 Q-78 265 -75 277 Q-72 281 -71 274 L-69 263 Q-67 271 -65 271 Q-62 270 -63 264 L-63 247 Q-61 231 -55 213 Q-49 197 -47 174 L-37 137Z"/>
      <use href="#arm" transform="scale(-1 1)"/>
      <!-- Continuous body outline; thighs end at the same level in both views -->
      <path d="M-11 66 Q-10 82 -16 86 L-39 95 Q-45 99 -44 111 L-45 130 Q-52 142 -48 154 C-46 168 -39 181 -39 195 Q-40 209 -48 226 C-57 245 -57 263 -54 282 L-46 349 Q-30 354 -14 350 L-4 302 Q-2 293 0 288 Q3 296 5 307 L14 350 Q31 354 46 349 L54 282 C57 262 56 247 48 226 Q40 207 39 195 C39 180 47 166 49 152 Q51 140 45 130 L44 111 Q45 99 39 95 L16 86 Q10 82 11 66Z"/>
      <path fill="none" stroke="#b09e93" stroke-width="1.15" d="M-23 92 Q-13 94 -6 101 M23 92 Q13 94 6 101 M-12 75 Q-2 83 8 77 M-41 261 Q-34 289 -33 305 M41 261 Q34 289 33 305"/>
      <!-- Hair pulled back and blank oval face -->
